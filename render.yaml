# Render blueprint for the Coach AI backend.
# Connect this repo on https://dashboard.render.com → "New" → "Blueprint" and pick this file.
# A free Postgres instance is provisioned and wired automatically.
services:
  - type: web
    name: coach-ai-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: coach-ai-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        # IMPORTANT: replace with your Netlify URL after the first deploy.
        value: https://your-site.netlify.app

databases:
  - name: coach-ai-db
    plan: free
    databaseName: coach_ai
    user: coach
